{% load static %}
<!doctype html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Recuperar Contraseña - IPP</title>
    <link rel="icon" type="image/svg+xml" href="{% static 'icon/LOGO_IPP_IUTAG.svg' %}">
    <link href="{% static 'css/bootstrap.min.css' %}" rel="stylesheet">
    <link rel="stylesheet" href="{% static 'css/bootstrap-icons.css' %}">
    <link rel="stylesheet" href="{% static 'css/uiverse.css' %}">
    <style>
        html, body { height: 100%; margin: 0; }
        body {
        background: #2c6e9c;
        background: linear-gradient(90deg, #2c6e9c 0%, #4a90d9 50%, #2b7a62 100%);
        font-family: Verdana, Geneva, Tahoma, sans-serif;
        display: flex;
        flex-direction: column;
        }
        .main-content { flex: 1; display: flex; align-items: center; justify-content: center; padding: 2rem 1rem; }
    </style>
</head>
<body>
    <div class="container text-center py-4">
        <div class="d-inline-block bg-white bg-opacity-10 rounded-3 px-4 py-2 mb-3" style="backdrop-filter: blur(4px);">
            <span class="text-white fw-bold" style="letter-spacing: 2px; font-size: 13px;">SISTEMA IPP — IUTAG</span>
        </div>
    </div>
    <div class="main-content">
        <div class="form-box">
            <div class="form">
                <i class="bi bi-hospital text-primary" style="font-size: 3rem;"></i>
                <span class="title">¿Olvidaste tu contraseña?</span>
                <span class="subtitle">Ingresa tu correo registrado y te enviaremos un enlace para recuperar tu cuenta.</span>
                <form method="post">
                    {% csrf_token %}
                    <div class="form-container">
                        <input type="email" name="email" id="id_email" class="input" placeholder="Correo Electrónico" required>
                        {% if form.email.errors %}
                            <div style="color:#dc3545; font-size:.8rem; padding:4px 15px;">{{ form.email.errors }}</div>
                        {% endif %}
                    </div>
                    <button type="submit">Enviar instrucciones</button>
                </form>
            </div>
            <div class="form-section">
                <p><a href="{% url 'login' %}">Volver al inicio de sesión</a></p>
            </div>
        </div>
    </div>
</body>
</html>
