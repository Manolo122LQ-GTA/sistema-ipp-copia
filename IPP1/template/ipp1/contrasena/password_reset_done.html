{% load static %}
<!doctype html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Correo Enviado - IPP</title>
    <link rel="icon" type="image/svg+xml" href="{% static 'icon/LOGO_IPP_IUTAG.svg' %}">
    <link href="{% static 'css/bootstrap.min.css' %}" rel="stylesheet">
    <link rel="stylesheet" href="{% static 'css/bootstrap-icons.css' %}">
    <link rel="stylesheet" href="{% static 'css/uiverse.css' %}">
    <style>
        html, body { height: 100%; margin: 0; }
        body {
        background: #2c6e9c;
        background: linear-gradient(90deg, #2c6e9c 0%, #4a90d9 50%, #2b7a62 100%);
        font-family: Verdana, Geneva, Tahoma, sans-serif;
        display: flex;
        flex-direction: column;
        }
        .main-content { flex: 1; display: flex; align-items: center; justify-content: center; padding: 2rem 1rem; }
    </style>
</head>
<body>
    <div class="main-content">
        <div class="form-box">
            <div class="form">
                <i class="bi bi-envelope-check text-success" style="font-size: 3rem;"></i>
                <span class="title">Correo Enviado</span>
                <span class="subtitle">Te hemos enviado un correo con las instrucciones para restablecer tu contraseña. Revisa tu bandeja de entrada (y la carpeta de spam).</span>
            </div>
            <div class="form-section">
                <p><a href="{% url 'login' %}">Volver al inicio de sesión</a></p>
            </div>
        </div>
    </div>
</body>
</html>
