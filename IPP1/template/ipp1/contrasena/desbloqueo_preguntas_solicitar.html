{% load static %}
<!doctype html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Desbloquear por pregunta de seguridad - IPP</title>
    <link rel="icon" type="image/svg+xml" href="{% static 'icon/LOGO_IPP_IUTAG.svg' %}">
    <link href="{% static 'css/bootstrap.min.css' %}" rel="stylesheet">
    <link rel="stylesheet" href="{% static 'css/bootstrap-icons.css' %}">
    <link rel="stylesheet" href="{% static 'css/uiverse.css' %}?v=5">
</head>
<body class="auth-reset-page">
    <div class="container text-center py-4">
        <div class="d-inline-block bg-white bg-opacity-10 rounded-3 px-4 py-2 mb-3" style="backdrop-filter: blur(4px);">
            <span class="text-white fw-bold" style="letter-spacing: 2px; font-size: 13px;">SISTEMA IPP — IUTAG</span>
        </div>
    </div>
    <div class="main-content">
        <div class="form-box">
            <div class="form">
                <img src="{% static 'img/ipp_logo.png' %}" width="200" height="128" class="mb-4 d-block mx-auto" alt="Logo IPP">
                <span class="title">Desbloquear cuenta</span>
                <span class="subtitle">Ingresa tu usuario o correo registrado. Te pediremos 2 preguntas de seguridad.</span>
                {% if messages %}
                    {% for message in messages %}
                        <div class="alert alert-{% if message.tags == 'error' %}danger{% else %}{{ message.tags|default:'info' }}{% endif %} py-2 small" role="alert">
                            {{ message }}
                        </div>
                    {% endfor %}
                {% endif %}
                <form method="post">
                    {% csrf_token %}
                    <div class="form-container">
                        <input type="text" name="identifier" id="id_identifier" class="input"
                               placeholder="Usuario o correo electrónico" value="{{ identifier }}"
                               autocomplete="username" required>
                    </div>
                    <button type="submit">Enviar preguntas</button>
                </form>
            </div>
        </div>
    </div>
</body>
</html>
