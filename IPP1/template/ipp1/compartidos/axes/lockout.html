{% load static %}
<!doctype html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Cuenta Bloqueada - IPP</title>
    <link rel="icon" type="image/svg+xml" href="{% static 'icon/LOGO_IPP_IUTAG.svg' %}">
    <link href="{% static 'css/bootstrap.min.css' %}" rel="stylesheet">
    <link href="{% static 'css/bootstrap-icons.css' %}" rel="stylesheet">
    <link href="{% static 'css/uiverse.css' %}?v=5" rel="stylesheet">
</head>
<body class="lockout-page">
    <div class="lockout-card">
        <div class="lockout-icon">
            <i class="bi bi-shield-lock-fill"></i>
        </div>
        <h2 class="lockout-title">Cuenta Bloqueada</h2>
        <p class="lockout-text">
            Demasiados intentos de inicio de sesión fallidos.<br>
            Su cuenta ha sido bloqueada por motivos de seguridad.
        </p>
        <div class="alert alert-warning">
            <i class="bi bi-clock me-2"></i>
            Contacta con el Administrador para restablecer la cuenta.
        </div>
        <a href="{% url 'login' %}" class="btn-return">
            <i class="bi bi-arrow-left me-1"></i>Volver al inicio de sesión
        </a>
    </div>
</body>
</html>
